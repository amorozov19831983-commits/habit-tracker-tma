<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #1a1a2e, #0f0f1a, #000000);
            color: white;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .purple-accent {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            box-shadow: 0 0 20px rgba(106, 17, 203, 0.5);
        }
        .habit-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .habit-card:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="p-6">
    <div class="max-w-md mx-auto space-y-8">
        <header class="text-center space-y-2">
            <h1 class="text-4xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-300">
                Habit Tracker
            </h1>
            <p class="text-gray-400 text-sm">Your journey to a better self</p>
        </header>

        <div class="glass p-6 space-y-4">
            <div class="flex gap-2">
                <input id="habitInput" type="text" placeholder="Enter new habit..." 
                    class="flex-1 bg-white/10 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all">
                <button onclick="addHabit()" class="purple-accent px-6 py-3 rounded-xl font-semibold active:scale-95 transition-transform">
                    Add
                </button>
            </div>
        </div>

        <div id="habitsList" class="space-y-4">
            <!-- Habits will be injected here -->
        </div>
    </div>

    <script>
        let habits = JSON.parse(localStorage.getItem('habits')) || [];

        function saveHabits() {
            localStorage.setItem('habits', JSON.stringify(habits));
        }

        function formatTime(ms) {
            const seconds = Math.floor((ms / 1000) % 60);
            const minutes = Math.floor((ms / (1000 * 60)) % 60);
            const hours = Math.floor((ms / (1000 * 60 * 60)) % 24);
            const days = Math.floor(ms / (1000 * 60 * 60 * 24));

            return `${days}d ${hours}h ${minutes}m ${seconds}s`;
        }

        function addHabit() {
            const input = document.getElementById('habitInput');
            if (!input.value.trim()) return;

            const habit = {
                id: Date.now(),
                name: input.value,
                startTime: Date.now()
            };

            habits.push(habit);
            saveHabits();
            input.value = '';
            render();
        }

        function resetHabit(id) {
            const habit = habits.find(h => h.id === id);
            if (habit) {
                habit.startTime = Date.now();
                saveHabits();
                render();
            }
        }

        function deleteHabit(id) {
            habits = habits.filter(h => h.id !== id);
            saveHabits();
            render();
        }

        function render() {
            const list = document.getElementById('habitsList');
            list.innerHTML = '';

            habits.forEach(habit => {
                const card = document.createElement('div');
                card.className = 'glass habit-card p-5 flex flex-col space-y-3';
                
                const timerId = `timer-${habit.id}`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-lg font-semibold text-gray-100">${habit.name}</span>
                        <button onclick="deleteHabit(${habit.id})" class="text-gray-500 hover:text-red-400 transition-colors text-xs">Delete</button>
                    </div>
                    <div id="${timerId}" class="text-2xl font-mono text-purple-300 text-center py-2 tracking-wider">
                        ${formatTime(Date.now() - habit.startTime)}
                    </div>
                    <button onclick="resetHabit(${habit.id})" 
                        class="w-full py-2 rounded-lg bg-white/5 border border-white/10 text-gray-300 hover:bg-white/10 transition-all text-sm">
                        Reset Progress
                    </button>
                `;
                list.appendChild(card);
            });
        }

        function updateTimers() {
            habits.forEach(habit => {
                const el = document.getElementById(`timer-${habit.id}`);
                if (el) {
                    el.innerText = formatTime(Date.now() - habit.startTime);
                }
            });
            requestAnimationFrame(updateTimers);
        }

        render();
        updateTimers();
    </script>
</body>
</html>
